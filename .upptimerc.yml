# Change these first
owner: GalaxyLittlepaws # Your GitHub organization or username, where this repository lives
repo: galaxy-creatures-uptime # The name of this repository
user-agent: GalaxyLittlepaws

assignees:
  - GalaxyLittlepaws

secrets:
  - SITE_API

skipDeleteIssues: true
skipPoweredByReadme: true

sites:
  - name: "Galaxy's Creatures Website"
    url: https://galaxyscreatures.com/
  - name: "Galaxy's Creatures API"
    url: $SITE_API

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.galaxyscreatures.com
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/GalaxyLittlepaws/galaxy-creatures-uptime/master/assets/Logo.png
  favicon: https://raw.githubusercontent.com/GalaxyLittlepaws/galaxy-creatures-uptime/master/assets/favicon.ico
  # Dark theme file, served from the status site itself: it's copied into the
  # site export and deployed atomically with the page, so it gets the correct
  # text/css MIME type with no CDN or cache to manage.
  themeUrl: https://status.galaxyscreatures.com/galaxy-theme.css
  name: "Galaxy's Creatures Status"
  introTitle: "**Galaxy's Creatures** service status"
  introMessage: "We run automated checks on our [website](https://galaxyscreatures.com/) and API every 5 minutes. Downtime is posted here as soon as it's detected."
  navbar:
    - title: "Galaxy's Creatures Status"
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  footer: "[Galaxy's Creatures](https://galaxyscreatures.com/) service status"

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
