# Change these first
owner: GalaxyLittlepaws # Your GitHub organization or username, where this repository lives
repo: galaxy-creatures-uptime # The name of this repository

secrets:
  - SITE_API

sites:
  - name: "Galaxy's Creatures Website"
    url: https://galaxyscreatures.com/
  - name: "Galaxy's Creatures API"
    url: $SITE_API

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.galaxyscreatures.com
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: "Galaxy's Creatures Status"
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a status page which uses **real-time** data from our [GitHub repository](https://github.com/GalaxyLittlepaws/galaxy-creatures-uptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: "Galaxy's Creatures Status"
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
