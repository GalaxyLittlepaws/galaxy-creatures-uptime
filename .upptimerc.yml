# Change these first
owner: GalaxyLittlepaws # Your GitHub organization or username, where this repository lives
repo: galaxy-creatures-uptime # The name of this repository
user-agent: GalaxyLittlepaws

assignees:
  - GalaxyLittlepaws

secrets:
  - SITE_API

skipDeleteIssues: true
skipPoweredByReadme: true

sites:
  - name: "Galaxy's Creatures Website"
    url: https://galaxyscreatures.com/
  - name: "Galaxy's Creatures API"
    url: $SITE_API

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.galaxyscreatures.com
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/GalaxyLittlepaws/galaxy-creatures-uptime/master/assets/Logo.png
  favicon: https://raw.githubusercontent.com/GalaxyLittlepaws/galaxy-creatures-uptime/master/assets/favicon.ico
  # Single theme file (light + dark) served with correct MIME type by jsDelivr.
  # Served via CDN because GitHub raw rejects stylesheets (text/plain + nosniff)
  # and local paths break the site export.
  themeUrl: https://cdn.jsdelivr.net/gh/GalaxyLittlepaws/galaxy-creatures-uptime@master/assets/galaxy-theme.css
  # Injects the light/dark toggle button into the navbar.
  customHeadHtml: |
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("gc-theme"); } catch (e) {}
        var dark = saved === "dark" || (saved === null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var btn = document.createElement("button");
        btn.id = "gc-theme-toggle";
        btn.type = "button";
        btn.title = "Toggle theme";
        btn.textContent = dark ? "\u2600" : "\u263E";
        btn.addEventListener("click", function () {
          dark = !dark;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          btn.textContent = dark ? "\u2600" : "\u263E";
          try { localStorage.setItem("gc-theme", dark ? "dark" : "light"); } catch (e) {}
        });
        function mount() {
          var ul = document.querySelector("nav ul");
          if (ul) { var li = document.createElement("li"); li.appendChild(btn); ul.appendChild(li); }
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount);
        else mount();
      })();
    </script>
  name: "Galaxy's Creatures Status"
  introTitle: "**Galaxy's Creatures** service status"
  introMessage: "We run automated checks on our [website](https://galaxyscreatures.com/) and API every 5 minutes. Downtime is posted here as soon as it's detected."
  navbar:
    - title: "Galaxy's Creatures Status"
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  footer: "[Galaxy's Creatures](https://galaxyscreatures.com/) service status"

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
